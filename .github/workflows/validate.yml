name: Validate Home Assistant config

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          pip install yamllint homeassistant

      - name: Run repository validation script
        run: bash scripts/validate.sh

      - name: Run repository regression tests
        run: python -m unittest discover -s tests -v
